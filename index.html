<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stone-Paper-Scissor</title>
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

    <main>

        <div class="header">
            STONE <span>-</span> PAPER <span>-</span> SCISSOR
        </div>

        <p class="subtitle">MAKE YOUR MOVE!</p>

        <div class="options">
            <div class="images" id="stone"></div>
            <div class="images" id="paper"></div>
            <div class="images" id="scissor"></div>
        </div>

        <p class="instruction">Choose your weapon</p>

        <div class="game">

            <div class="choice">
                <p>YOU</p>
                <div class="image uchoice"></div>
            </div>

            <div class="vs">VS</div>

            <div class="choice">
                <p>COMPUTER</p>
                <div class="image cchoice"></div>
            </div>

        </div>

        <div class="score">

            <div>
                <p class="you">YOU</p>
                <p class="yscore">0</p>
            </div>

            <div>
                <p class="computer">COMPUTER</p>
                <p class="cscore">0</p>
            </div>

        </div>

        <p class="result">GOOD LUCK!</p>

    </main>
<script src="app.js"></script>
</body>
</html>
